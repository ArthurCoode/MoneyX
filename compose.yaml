# Ambiente local completo: PostgreSQL + Redis (rate limit) + Mailpit (e-mail de dev) + API MoneyX + frontend (Next.js).
#
#   docker compose up -d --build     → sobe tudo (compila as imagens se o código mudou): http://localhost:3000
#   docker compose up -d postgres    → só o banco (para rodar a app pelo IntelliJ / mvnw)
#
# O Compose lê o arquivo .env desta pasta sozinho. "${VAR:?mensagem}" faz o Compose RECUSAR subir com a mensagem
# se a variável faltar, em vez de subir com um valor vazio.
#
# Portas publicadas só em 127.0.0.1: acessíveis desta máquina, não de outras da rede (Wi-Fi, por exemplo).

services:
  postgres:
    image: postgres:17-alpine
    container_name: moneyx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - moneyx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Caixa de e-mail FALSA de desenvolvimento: recebe por SMTP tudo o que a app envia (verificação de e-mail) e mostra
  # em http://localhost:8025. Nenhum e-mail sai para a internet. Versão fixada por digest (como as imagens do Dockerfile).
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    container_name: moneyx-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # interface web
      - "127.0.0.1:1025:1025"   # SMTP (para a app rodando pelo IntelliJ / mvnw)

  # Baldes do rate limit do cadastro (moneyx.rate-limit.store=redis), compartilhados se houver mais de uma instância
  # da app. Só em memória (sem gravar em disco): perder os baldes num reinício só "perdoa" quem estava limitado.
  redis:
    image: redis:8.8.4-alpine@sha256:1273af45b299d2b8b60d0e400d90aa6c2c5b1794f01d6a7ca60ff3ba6e65efb5
    container_name: moneyx-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"   # para a app rodando pelo IntelliJ / mvnw
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: moneyx-app:local
    container_name: moneyx-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      # Dentro da rede do Compose o banco é alcançado pelo NOME do serviço ("postgres"), não por localhost.
      # Variáveis de ambiente sobrepõem o application.properties (SPRING_DATASOURCE_URL = spring.datasource.url).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      # E-mail de verificação: o SMTP de desenvolvimento é o Mailpit (pelo nome do serviço).
      MONEYX_MAIL_HOST: mailpit
      MONEYX_MAIL_PORT: "1025"
      MONEYX_PUBLIC_BASE_URL: ${MONEYX_PUBLIC_BASE_URL:-http://localhost:8080}
      MONEYX_DASHBOARD_BASE_URL: ${MONEYX_DASHBOARD_BASE_URL:-http://localhost:3000}
      # Rate limit do cadastro no Redis (pelo nome do serviço).
      MONEYX_RATE_LIMIT_STORE: redis
      MONEYX_REDIS_HOST: redis
      # Proxies confiáveis para X-Forwarded-For/Proto (regex). Padrão: SÓ o frontend (IP fixo abaixo), que repassa o IP
      # real do visitante (o guarda do frontend sobrescreve qualquer X-Forwarded-For forjado). Assim os limites por IP
      # valem por visitante, e não para o frontend inteiro.
      MONEYX_TRUSTED_PROXIES: ${MONEYX_TRUSTED_PROXIES:-172\.30\.0\.10}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      MONEYX_WEBHOOK_ENCRYPTION_KEY: ${MONEYX_WEBHOOK_ENCRYPTION_KEY:?defina MONEYX_WEBHOOK_ENCRYPTION_KEY no .env}
      # Opcional: só durante a rotação da chave (vazio = nenhuma chave anterior).
      MONEYX_WEBHOOK_ENCRYPTION_KEY_PREVIOUS: ${MONEYX_WEBHOOK_ENCRYPTION_KEY_PREVIOUS:-}
      # Credencial do Mercado Pago (vazio = só o provedor sandbox funciona).
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      # Emissor da cobrança Pix: sandbox (padrão, local) ou mercadopago (precisa do token acima).
      MONEYX_PIX_PROVIDER: ${MONEYX_PIX_PROVIDER:-sandbox}
      # SÓ no sandbox do Mercado Pago: "APRO" faz a order ser aprovada sozinha. Vazio em produção.
      MONEYX_PIX_MERCADOPAGO_TEST_PAYER_FIRST_NAME: ${MONEYX_PIX_MERCADOPAGO_TEST_PAYER_FIRST_NAME:-}
      MONEYX_PIX_MERCADOPAGO_BASE_URL: ${MONEYX_PIX_MERCADOPAGO_BASE_URL:-https://api.mercadopago.com}
    ports:
      # Só a API. A porta de gerenciamento (8081: health/métricas) fica dentro do container, usada pelo HEALTHCHECK.
      - "127.0.0.1:8080:8080"
    # Endurecimento: sistema de arquivos somente leitura (exceto /tmp, usado pelo Tomcat), nenhuma capability do
    # Linux e proibição de ganhar privilégios depois de iniciado. Uma falha explorada na app tem pouco a fazer.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Landing + painel do comerciante + BFF (Next.js). Fala com a API pela rede interna (http://app:8080); o navegador
  # só fala com o frontend. Mesmo endurecimento da app.
  frontend:
    build: ./frontend
    image: moneyx-frontend:local
    container_name: moneyx-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      MONEYX_API_URL: http://app:8080
      # Endereço da API que o NAVEGADOR usa (link da documentação na landing).
      MONEYX_PUBLIC_API_URL: ${MONEYX_PUBLIC_BASE_URL:-http://localhost:8080}
      # "true" só com um proxy confiável NA FRENTE do frontend (que já escreve o X-Forwarded-For certo).
      MONEYX_TRUST_FORWARDED_FOR: ${MONEYX_TRUST_FORWARDED_FOR:-false}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      default:
        # IP fixo: é o único em que a API confia para ler o X-Forwarded-For (MONEYX_TRUSTED_PROXIES).
        ipv4_address: 172.30.0.10
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# Rede com faixa fixa para o frontend ter IP conhecido. Se 172.30.0.0/24 já existir na sua máquina, troque aqui, no
# ipv4_address do frontend e no MONEYX_TRUSTED_PROXIES.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  moneyx_postgres_data:

# Dependabot: abre pull requests quando saem versões novas das dependências. Cada PR passa pelo CI antes do merge.
#
# - Semanal (segunda de manhã), para não virar uma enxurrada de PRs.
# - Atualizações menores e de correção (minor/patch) vêm AGRUPADAS num PR por ecossistema; versões maiores (major,
#   que podem quebrar compatibilidade) vêm em PRs separados, para serem avaliadas uma a uma.
# - cooldown: só propõe uma versão depois de alguns dias publicada. Versões comprometidas ou com defeito costumam ser
#   descobertas e retiradas nesse intervalo.
#
# A imagem do Trivy, usada num "docker run" dentro do ci.yml, NÃO é vista pelo Dependabot: atualizar à mão.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    # TypeScript MAIOR fica de fora: typescript-eslint (via eslint-config-next) aceita até <6.1 e openapi-typescript 7.13
    # exige ^5 (PR #6, TS 7.0.2, reprovado no CI e fechado). Remover esta regra quando os dois suportarem a versão nova.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build

  # Imagem base do frontend (frontend/Dockerfile, node:26-alpine por digest). Node MAIOR é decisão do projeto (LTS).
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      frontend-docker-base-images:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Imagens base do Dockerfile (fixadas por tag + digest: o Dependabot atualiza os dois).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    # A versão do Java é decisão do projeto (Java 25 LTS desde 2026-11-25, ver SKILL.md), não do Dependabot: ele já
    # propôs 21 → 24, uma versão SEM suporte longo (PR #2, fechado). Versões maiores do eclipse-temurin são ignoradas;
    # novos digests e correções da mesma linha 25 continuam chegando. Migrar de LTS = etapa própria (pom, CI, Dockerfile).
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
    groups:
      docker-base-images:
        patterns: ["*"]
    commit-message:
      prefix: build

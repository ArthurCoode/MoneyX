# Configuração adicional dos TESTES. Fica em config/ de propósito: o Spring Boot carrega este arquivo ALÉM de
# src/main/resources/application.properties (e com prioridade sobre ele). Um application.properties na raiz
# de src/test/resources esconderia o principal.

# Os jobs agendados não rodam sozinhos durante os testes: mudariam dados no meio dos cenários.
# Os testes chamam PaymentMaintenanceService diretamente, com relógio controlado.
moneyx.jobs.enabled=false

# Chave FIXA, somente para testes (não é segredo: só cifra dados de teste). Produção/dev usam o .env.
moneyx.webhooks.encryption-key=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=

# Banco dos testes: PostgreSQL DESCARTÁVEL em Docker (Testcontainers), nunca o banco de desenvolvimento.
# O prefixo jdbc:tc: faz o driver do Testcontainers subir o container na primeira conexão (mesma imagem do
# compose.yaml) e o Flyway aplica todas as migrations nele. TC_DAEMON=true mantém o mesmo container durante toda a
# execução (reaproveitado por todos os contextos de teste), em vez de recriá-lo quando um pool é fechado.
# Exige apenas o Docker rodando; não precisa de POSTGRES_PASSWORD nem do container moneyx-postgres.
spring.datasource.url=jdbc:tc:postgresql:17-alpine:///moneyx?TC_DAEMON=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

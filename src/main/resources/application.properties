spring.application.name=moneyx

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/moneyx
spring.datasource.username=moneyx_user
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# API
# Idioma fixo em inglês para todas as respostas (inclusive mensagens de validação),
# independente do idioma do servidor ou do header Accept-Language do cliente.
spring.web.locale=en
spring.web.locale-resolver=fixed

# JSON
# CRÍTICO para dinheiro: por padrão o Jackson aceita um número decimal num campo inteiro e o TRUNCA
# (ex.: "amount": 4990.5 vira 4990, sem erro). Desligado, qualquer decimal num campo inteiro gera 400.
# Coberto por PaymentControllerTest.decimalAmountIsRejectedInsteadOfTruncated.
spring.jackson.deserialization.accept-float-as-int=false

# Security
# A autenticação é feita exclusivamente por API Key (com.moneyx.security). Sem esta exclusão,
# o Spring Boot criaria um usuário padrão "user" com senha gerada e a imprimiria no log.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
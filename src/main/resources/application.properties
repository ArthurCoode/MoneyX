spring.application.name=moneyx

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/moneyx
spring.datasource.username=moneyx_user
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# API
# Idioma fixo em inglês para todas as respostas (inclusive mensagens de validação),
# independente do idioma do servidor ou do header Accept-Language do cliente.
spring.web.locale=en
spring.web.locale-resolver=fixed

# JSON
# CRÍTICO para dinheiro: por padrão o Jackson aceita um número decimal num campo inteiro e o TRUNCA
# (ex.: "amount": 4990.5 vira 4990, sem erro). Desligado, qualquer decimal num campo inteiro gera 400.
# Coberto por PaymentControllerTest.decimalAmountIsRejectedInsteadOfTruncated.
spring.jackson.deserialization.accept-float-as-int=false

# Security
# A autenticação é feita exclusivamente por API Key (com.moneyx.security). Sem esta exclusão,
# o Spring Boot criaria um usuário padrão "user" com senha gerada e a imprimiria no log.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Jobs agendados (com.moneyx.payment.job): expiração de pagamentos e limpeza de chaves de idempotência.
# Desligados nos testes (src/test/resources/config/application.properties).
moneyx.jobs.enabled=true

# Webhooks
# Chave AES-256 (32 bytes em Base64) que cifra os segredos de assinatura dos webhooks. Fica no .env, nunca no Git.
# Sem ela a aplicação não sobe (ver shared/crypto/CryptoConfig).
moneyx.webhooks.encryption-key=${MONEYX_WEBHOOK_ENCRYPTION_KEY:}
# Permite cadastrar http://localhost (somente para testes locais). NUNCA ligar em produção: abre caminho para SSRF.
moneyx.webhooks.allow-local-urls=false

# Entrega de webhooks (webhook/service/WebhookDeliveryProperties). Valores padrão da v1, explícitos aqui.
moneyx.webhooks.delivery.connect-timeout=5s
moneyx.webhooks.delivery.request-timeout=10s
# A reserva precisa durar mais que connect + request, senão outra execução reenviaria durante o envio.
moneyx.webhooks.delivery.lease=30s
moneyx.webhooks.delivery.batch-size=10

# Agendador com 2 threads: uma loja lenta atrasa a entrega de webhooks, mas não a expiração de pagamentos.
spring.task.scheduling.pool.size=2

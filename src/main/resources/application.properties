spring.application.name=moneyx

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/moneyx
spring.datasource.username=moneyx_user
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# API
# Idioma fixo em inglês para todas as respostas (inclusive mensagens de validação),
# independente do idioma do servidor ou do header Accept-Language do cliente.
spring.web.locale=en
spring.web.locale-resolver=fixed

# JSON
# CRÍTICO para dinheiro: por padrão o Jackson aceita um número decimal num campo inteiro e o TRUNCA
# (ex.: "amount": 4990.5 vira 4990, sem erro). Desligado, qualquer decimal num campo inteiro gera 400.
# Coberto por PaymentControllerTest.decimalAmountIsRejectedInsteadOfTruncated.
spring.jackson.deserialization.accept-float-as-int=false

# Security
# A autenticação é feita exclusivamente por API Key (com.moneyx.security). Sem esta exclusão,
# o Spring Boot criaria um usuário padrão "user" com senha gerada e a imprimiria no log.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Jobs agendados (com.moneyx.payment.job): expiração de pagamentos e limpeza de chaves de idempotência.
# Desligados nos testes (src/test/resources/config/application.properties).
moneyx.jobs.enabled=true

# Webhooks
# Chave AES-256 (32 bytes em Base64) que cifra os segredos de assinatura dos webhooks. Fica no .env, nunca no Git.
# Sem ela a aplicação não sobe (ver shared/crypto/CryptoConfig).
moneyx.webhooks.encryption-key=${MONEYX_WEBHOOK_ENCRYPTION_KEY:}
# Permite cadastrar http://localhost (somente para testes locais). NUNCA ligar em produção: abre caminho para SSRF.
moneyx.webhooks.allow-local-urls=false

# Entrega de webhooks (webhook/service/WebhookDeliveryProperties). Valores padrão da v1, explícitos aqui.
moneyx.webhooks.delivery.connect-timeout=5s
moneyx.webhooks.delivery.request-timeout=10s
# A reserva precisa durar mais que connect + request, senão outra execução reenviaria durante o envio.
moneyx.webhooks.delivery.lease=30s
moneyx.webhooks.delivery.batch-size=10

# Agendador com 2 threads: uma loja lenta atrasa a entrega de webhooks, mas não a expiração de pagamentos.
spring.task.scheduling.pool.size=2

# Limite do cadastro público (POST /v1/merchants), por IP da conexão: token bucket com 5 tentativas em rajada e
# recarga de 1 a cada 2 minutos. Em memória: vale para UMA instância (com várias, mover para Redis).
moneyx.rate-limit.signup.capacity=5
moneyx.rate-limit.signup.refill-period=2m
moneyx.rate-limit.signup.max-keys=100000

# Documentação da API (springdoc): /v3/api-docs (contrato) e /swagger-ui.html (página navegável), públicas.
# OpenAPI 3.1 é necessário para a seção "webhooks". As chaves NÃO são ordenadas alfabeticamente na saída: isso
# trocava a ordem natural das operações (DELETE antes de GET). O teste de contrato ordena só na comparação.
springdoc.api-docs.version=openapi_3_1
springdoc.default-produces-media-type=application/json
# Swagger UI: grupos recolhidos, sem a seção "Schemas" no fim (os schemas aparecem dentro de cada operação),
# a chave do Authorize sobrevive ao recarregar a página, duração de cada chamada e caixa de busca por grupo.
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.default-models-expand-depth=-1
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true

# Observabilidade
# Actuator (health, metrics, prometheus) numa PORTA DE GERENCIAMENTO separada, ouvindo só na própria máquina:
# métricas revelam o volume do negócio e não podem ser públicas. A porta da API (8080) não expõe /actuator.
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,metrics,prometheus
# Id de correlação em toda linha de log (texto, no desenvolvimento). Em produção, logs em JSON (formato ECS) com
# a variável de ambiente LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs: o requestId vai junto, como campo do JSON (MDC).
logging.pattern.correlation=[%X{requestId:-}]
# Requisição malformada (ex.: header quebrado): o Tomcat a recusa com 400 e, na 1ª ocorrência, registra em INFO a
# LINHA DO HEADER inteira, que pode conter a API Key (as seguintes vão para DEBUG). Isso acontece antes do nosso
# código, fora do alcance do teste de revisão de logs. WARN corta os dois níveis. Coberto por HttpHardeningIntegrationTest.
logging.level.org.apache.coyote.http11.Http11Processor=WARN

